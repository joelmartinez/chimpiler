name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Extract version from csproj files
      id: version
      run: |
        CLI_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/Chimpiler/Chimpiler.csproj)
        LIB_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/Chimpiler.EfMigrate/Chimpiler.EfMigrate.csproj)
        echo "cli_base_version=$CLI_VERSION" >> $GITHUB_OUTPUT
        echo "cli_full_version=$CLI_VERSION.${{ github.run_number }}" >> $GITHUB_OUTPUT
        echo "lib_base_version=$LIB_VERSION" >> $GITHUB_OUTPUT
        echo "lib_full_version=$LIB_VERSION.${{ github.run_number }}" >> $GITHUB_OUTPUT
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Chimpiler CLI tool
      run: dotnet build src/Chimpiler/Chimpiler.csproj --no-restore --configuration Release /p:Version=${{ steps.version.outputs.cli_full_version }}
    
    - name: Build Chimpiler.EfMigrate library
      run: dotnet build src/Chimpiler.EfMigrate/Chimpiler.EfMigrate.csproj --no-restore --configuration Release /p:Version=${{ steps.version.outputs.lib_full_version }}
    
    - name: Build Chimpiler.Core
      run: dotnet build src/Chimpiler.Core/Chimpiler.Core.csproj --no-restore --configuration Release
    
    - name: Build Chimpiler.TestFixtures
      run: dotnet build tests/Chimpiler.TestFixtures/Chimpiler.TestFixtures.csproj --no-restore --configuration Release
    
    - name: Build Chimpiler.Tests
      run: dotnet build tests/Chimpiler.Tests/Chimpiler.Tests.csproj --no-restore --configuration Release
    
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
    
    - name: Pack Chimpiler CLI tool
      run: dotnet pack src/Chimpiler/Chimpiler.csproj --no-build --configuration Release --output ./artifacts /p:Version=${{ steps.version.outputs.cli_full_version }}

    - name: Smoke test packed Chimpiler CLI tool
      shell: bash
      run: |
        set -euo pipefail
        dotnet tool install --tool-path ./tool-smoke --add-source ./artifacts Chimpiler --version "${{ steps.version.outputs.cli_full_version }}"
        ./tool-smoke/chimpiler kb --help

    - name: Pack Chimpiler.EfMigrate library
      run: dotnet pack src/Chimpiler.EfMigrate/Chimpiler.EfMigrate.csproj --no-build --configuration Release --output ./artifacts /p:Version=${{ steps.version.outputs.lib_full_version }}
    
    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget
        with:
          user: codecubeventures

      - name: Push to nuget.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Smoke test published Chimpiler CLI tool
        shell: bash
        run: |
          set -euo pipefail
          version=$(find ./artifacts -maxdepth 1 -name 'Chimpiler.[0-9]*.nupkg' -printf '%f\n' | sed -E 's/^Chimpiler\.([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)\.nupkg$/\1/' | head -n 1)
          test -n "$version"
          for attempt in {1..12}; do
            rm -rf ./published-tool-smoke
            if dotnet tool install --tool-path ./published-tool-smoke Chimpiler --version "$version" --add-source "https://api.nuget.org/v3/index.json" --ignore-failed-sources; then
              ./published-tool-smoke/chimpiler kb --help
              exit 0
            fi

            sleep 10
          done

          echo "Chimpiler $version was not installable with the kb command from NuGet.org." >&2
          exit 1
